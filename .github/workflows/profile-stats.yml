name: "♻️ Update GitHub Profile Activity / Metrics"

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:

jobs:
  update-profile-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Update profile README metrics
        uses: lowlighter/metrics@latest
        with:
          # Metrics needs a user token for account-wide activity reads.
          # The short-lived workflow token is used separately for writes.
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          filename: metrics.svg
          user: elvisowusu
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Accra
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_visibility: public
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_followup: yes
          plugin_habits: yes
          plugin_habits_facts: yes
          output_action: commit
